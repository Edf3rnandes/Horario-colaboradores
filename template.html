<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner de Treinos</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --surface2:#eef0f4; --text:#1b2330; --muted:#5d6878; --line:#dde1e8;
  --accent:#1f5fd1; --bad:#c62828; --bad-bg:#fdeaea; --warn:#a15c00; --warn-bg:#fff3dc; --ok:#1b7a3d; --ok-bg:#e4f5ea;
  --kids:#d98a00; --teens:#0f9d8a; --adulto:#3b6fd4; --competitivo:#8a4fd0; --korpus:#d6336c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161d; --surface:#1b212b; --surface2:#242c38; --text:#e8ecf2; --muted:#98a3b3; --line:#2f3947;
    --accent:#6ea0ff; --bad:#ff8a80; --bad-bg:#3a1f1f; --warn:#ffcc66; --warn-bg:#3a2f18; --ok:#7bd99a; --ok-bg:#183222;
    --kids:#f0b030; --teens:#34c4b0; --adulto:#7aa2ff; --competitivo:#b88af0; --korpus:#f783ac;
  }
}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1b212b; --surface2:#242c38; --text:#e8ecf2; --muted:#98a3b3; --line:#2f3947;
  --accent:#6ea0ff; --bad:#ff8a80; --bad-bg:#3a1f1f; --warn:#ffcc66; --warn-bg:#3a2f18; --ok:#7bd99a; --ok-bg:#183222;
  --kids:#f0b030; --teens:#34c4b0; --adulto:#7aa2ff; --competitivo:#b88af0; --korpus:#f783ac;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 0;max-width:1280px;margin:0 auto}
h1{margin:0;font-size:22px}
.sub{color:var(--muted);margin:2px 0 14px;font-size:14px}
main{max-width:1280px;margin:0 auto;padding:0 16px 48px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
nav.tabs button{white-space:nowrap}
button,select,input{font:inherit;color:var(--text)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;text-align:center;margin-left:4px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 11px;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.45}
select,input[type=number],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
input[type=number]{width:72px}
label.f{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.note.info{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note a{color:inherit;font-weight:700}

/* grade semanal */
.wk{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.wkgrid{display:grid;min-width:max-content;width:100%}
.dh{position:sticky;top:0;z-index:3;background:var(--surface2);padding:8px;text-align:center;font-weight:700;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.dh small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.gut{position:relative;background:var(--surface2)}
.gut span{position:absolute;right:6px;font-size:12px;color:var(--muted);transform:translateY(-7px)}
.col{position:relative;border-left:1px solid var(--line)}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.gap{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px);opacity:.7}
.blk{position:absolute;border-radius:7px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 17%,var(--surface));padding:3px 6px;overflow:hidden;font-size:12px;line-height:1.3;cursor:default}
.blk b{display:block;font-size:12.5px}
.blk .t{color:var(--muted)}
.blk.dim{opacity:.18}
.blk.bad{outline:2px solid var(--bad)}
.cK{--c:var(--kids)} .cT{--c:var(--teens)} .cA{--c:var(--adulto)} .cC{--c:var(--competitivo)} .cP{--c:var(--korpus)}

/* tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-size:13px;color:var(--muted);position:sticky;top:0}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 20%,var(--surface));color:var(--text);border:1px solid color-mix(in srgb,var(--c) 55%,var(--surface))}
.tag.bad{--c:var(--bad)}
.pcard ul{list-style:none;margin:8px 0 0;padding:0}
.pcard li{padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.role{font-size:11px;font-weight:700;padding:0 5px;border-radius:4px;background:var(--surface2);color:var(--muted);margin-left:4px}
.role.p{background:var(--accent);color:#fff}

/* quadras */
.seglist{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;align-items:center}
.sq{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:2px;background:var(--adulto)}
.sq.over{background:var(--bad)}
details{margin-bottom:10px}
summary{cursor:pointer;font-weight:700;padding:8px 0}
.bold-bad{color:var(--bad);font-weight:700}
.iss{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.blk{cursor:pointer}
#wkwrap:fullscreen{background:var(--bg);padding:12px;overflow:auto}
.zpct{min-width:62px;color:var(--text)!important;cursor:default}
.seg button:disabled{opacity:1}
.blk .bn{font-size:12.5px}
.blk .pp,.blk .pa{font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .pp{font-size:15px;margin-top:3px}
.blk .pa{font-size:14px}
.pl{font-size:9px;font-weight:700;color:var(--muted);margin-right:4px;letter-spacing:.4px;text-transform:uppercase}
.mp{display:inline-block;border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--text);margin-left:4px}
.mp.near{background:var(--warn-bg);color:var(--warn)}
.mp.full{background:var(--bad-bg);color:var(--bad)}
td.who{font-weight:700;font-size:15px}
dialog textarea{width:100%;min-height:150px;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:8px}
.ic{font-size:12px}
.rolebtns{display:flex;gap:6px;margin:6px 0 2px;flex-wrap:wrap}
.rolebtns .chip{padding:2px 9px;font-size:12.5px}
.rolebtns .chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.rolebtns .chip[aria-pressed="false"]{opacity:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);padding:18px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 2px}
dialog label{display:block;margin:12px 0 0;font-size:13px;color:var(--muted)}
dialog select{width:100%;margin-top:3px;font-size:15px}
.dlgact{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.edbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
@media (max-width:600px){ h1{font-size:19px} }
</style>
</head>
<body>
<header>
  <h1>Planner de Treinos</h1>
  <p class="sub">Unidades, horários, professores e auxiliares &middot; gerado da planilha “horário colaborador”</p>
</header>
<main>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="view"></div>
</main>
<dialog id="dlg"></dialog>
<input type="file" id="imp" accept="application/json" hidden>

<script>
const DATA = /*__DATA__*/null;
const DAYS = ["Seg","Ter","Qua","Qui","Sex","Sab"];
const DAY_LONG = {Seg:"Segunda",Ter:"Terça",Qua:"Quarta",Qui:"Quinta",Sex:"Sexta",Sab:"Sábado"};
const CATS = {Kids:"cK",Teens:"cT",Adulto:"cA",Competitivo:"cC",Korpus:"cP"};
const CAT_VAR = {Kids:"var(--kids)",Teens:"var(--teens)",Adulto:"var(--adulto)",Competitivo:"var(--competitivo)",Korpus:"var(--korpus)"};
const VIEWS = [["semana","Semana"],["turmas","Turmas"],["pessoas","Equipe"],["quadras","Quadras"]];
const PPM = 2.5, GAPH = 22;

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const state = {
  tab: store.get("tab","geral"), view: store.get("view","semana"), person: "", cats: new Set(Object.keys(CATS)),
  courts: {...DATA.courts, ...store.get("quadras", {})}, zoom: 1, fit: null,
  edits: {turmas:{}, funcoes:{}, pessoas:[], matriculas:{}, ...store.get("ajustes", {})}
};
const ROLES = {prof:{icon:"🎓", label:"Professor (formado)"}, est:{icon:"🌱", label:"Estagiário"}};
const ckey = c => c.unit+"|"+c.name;
const ORIG = DATA.classes;
const BASE = Object.fromEntries(ORIG.map(c => [c.id, {prof:c.prof, aux:[...c.aux], q:c.q||1}]));
/* Uma turma pode ter exceções por dia (ex.: só a sexta com outro professor). Cada exceção vira uma "turma" própria
   (id = id + 1000*(índice do dia+1)) com parent = id da turma original. */
function effEntry(o){
  const e = state.edits.turmas[ckey(o)], b = BASE[o.id];
  return {prof: e ? e.prof : b.prof, aux: e ? [...e.aux] : [...b.aux], q: (e && e.q) || b.q,
          dias: JSON.parse(JSON.stringify(e ? (e.dias||{}) : ((DATA.dias||{})[ckey(o)]||{})))};
}
function buildClasses(o){
  const e = effEntry(o);
  const ds = DAYS.filter(d => e.dias[d] && o.slots.some(s => s.d===d));
  const out = [];
  const main = {...o, prof:e.prof, aux:e.aux, q:e.q, parent:o.id, slots:o.slots.filter(s => !ds.includes(s.d))};
  if(main.slots.length) out.push(main);
  for(const d of ds){
    const x = e.dias[d];
    out.push({...o, id:o.id + 1000*(DAYS.indexOf(d)+1), parent:o.id, splitDay:d, slots:o.slots.filter(s => s.d===d),
              prof:x.prof, aux:[...x.aux], q:x.q || e.q});
  }
  return out;
}
function applyEdits(){ DATA.classes = ORIG.flatMap(buildClasses); }
const uniq = cs => cs.filter((c,i,a) => a.findIndex(x => x.parent===c.parent) === i);
const roleOf = n => state.edits.funcoes[n] || (DATA.funcoes||{})[n] || "";
const ic = n => roleOf(n) ? `<span class="ic" title="${ROLES[roleOf(n)].label}">${ROLES[roleOf(n)].icon}</span> ` : "";
const staffNames = () => [...new Set([
  ...Object.values(BASE).flatMap(b => [b.prof, ...b.aux]),
  ...DATA.classes.flatMap(c => [c.prof, ...c.aux]),
  ...Object.keys(DATA.funcoes||{}), ...Object.keys(state.edits.funcoes), ...(DATA.pessoas||[]), ...state.edits.pessoas
])].sort((a,b) => a.localeCompare(b,"pt"));
function saveEdits(){ store.set("ajustes", state.edits); }
const matOf = c => state.edits.matriculas[ckey(c)] || (DATA.matriculas||{})[ckey(c)] || null;
function matLevel(m){ const r = m.limite ? m.qtd/m.limite : 0; return r>=1 ? "full" : r>=0.8 ? "near" : ""; }
function matPill(c){ const m = matOf(c); return m ? `<span class="mp ${matLevel(m)}" title="Alunos matriculados / limite da turma">👥 ${m.qtd}/${m.limite}</span>` : ""; }
function matCell(c){
  const m = matOf(c); if(!m) return '<span class="muted">—</span>';
  const v = m.limite - m.qtd;
  return `<span class="mp ${matLevel(m)}" style="margin:0">${m.qtd}/${m.limite}</span><div class="muted small">${v>0 ? v+" vaga"+(v>1?"s":"") : "lotada"}</div>`;
}
applyEdits();

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const first = n => n.split(" ")[0];
const people = c => [{n:c.prof, r:"Prof"}, ...c.aux.map(n => ({n, r:"Aux"}))];
const classesOf = u => DATA.classes.filter(c => c.unit === u);
const byId = Object.fromEntries(DATA.classes.map(c => [c.id, c]));

function fmtSlots(c){
  const groups = [];
  for(const s of c.slots){
    const k = s.s+"-"+s.e; let g = groups.find(g => g.k===k);
    if(!g){ g = {k, s:s.s, e:s.e, days:[]}; groups.push(g); }
    g.days.push(s.d);
  }
  return groups.map(g => g.days.join("/")+" "+hm(g.s)+"–"+hm(g.e)).join(" · ");
}
const overlap = (a,b) => a.s < b.e && b.s < a.e;

/* ---------- conflitos ---------- */
function computeIssues(){
  const per = {};
  for(const c of DATA.classes) for(const p of people(c))
    for(const s of c.slots) (per[p.n] = per[p.n] || []).push({...s, c, r:p.r});
  const dup = new Map(), desl = new Map(), mesma = [];
  for(const [n, list] of Object.entries(per)){
    for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
      const a = list[i], b = list[j];
      if(a.d !== b.d || a.c.id === b.c.id) continue;
      const [x,y] = a.c.id < b.c.id ? [a,b] : [b,a];
      const key = n+"|"+x.c.id+"|"+y.c.id;
      if(overlap(a,b)){
        const e = dup.get(key) || {n, x, y, days:[]}; e.days.push(a.d); dup.set(key, e);
      } else if(a.c.unit !== b.c.unit){
        const gap = a.s >= b.e ? a.s - b.e : b.s - a.e;
        if(gap < 30){ const e = desl.get(key) || {n, x, y, days:[], gap}; e.days.push(a.d); desl.set(key, e); }
      }
    }
  }
  for(const c of DATA.classes) if(c.aux.includes(c.prof)) mesma.push(c);
  return {dup:[...dup.values()], desl:[...desl.values()], mesma,
          semAux: DATA.classes.filter(c => !c.aux.length),
          estResp: DATA.classes.filter(c => roleOf(c.prof)==="est")};
}
function dupClusters(){
  const out = [];
  const names = [...new Set(DATA.classes.flatMap(c => people(c).map(p => p.n)))];
  for(const n of names){
    const sigs = new Map();
    for(const d of DAYS){
      const list = [];
      for(const c of DATA.classes) for(const p of people(c)) if(p.n===n)
        for(const s of c.slots) if(s.d===d) list.push({...s, c, r:p.r});
      list.sort((a,b) => a.s-b.s || a.e-b.e);
      let cur = [], end = -1; const groups = [];
      for(const s of list){
        if(cur.length && s.s >= end){ groups.push(cur); cur = []; end = -1; }
        cur.push(s); end = Math.max(end, s.e);
      }
      if(cur.length) groups.push(cur);
      for(const g of groups){
        if(new Set(g.map(x => x.c.id)).size < 2) continue;
        const sig = g.map(x => x.c.id+"@"+x.s+"-"+x.e).join(",");
        const e = sigs.get(sig) || {n, items:g, days:[]}; e.days.push(d); sigs.set(sig, e);
      }
    }
    out.push(...sigs.values());
  }
  return out;
}
let ISSUES, CLUSTERS, issueClassIds;
function recompute(){
  ISSUES = computeIssues(); CLUSTERS = dupClusters();
  issueClassIds = new Set(ISSUES.dup.flatMap(e => [e.x.c.id, e.y.c.id]));
}
recompute();

/* ---------- navegação ---------- */
function renderTabs(){
  const tabs = [["geral","Visão geral"], ...DATA.units.map(u => [u,u]), ["conflitos","Conflitos"]];
  document.getElementById("tabs").innerHTML = tabs.map(([k,l]) =>
    `<button class="tab" role="tab" data-act="tab" data-v="${esc(k)}" aria-selected="${state.tab===k}">${esc(l)}${
      k==="conflitos" ? `<span class="badge">${CLUSTERS.length}</span>` : ""}</button>`).join("");
}
function render(){
  recompute();
  renderTabs();
  const v = document.getElementById("view");
  if(state.tab==="geral") v.innerHTML = overviewView();
  else if(state.tab==="conflitos") v.innerHTML = issuesView();
  else v.innerHTML = unitView(state.tab);
  applyZoom();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if(!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  if(a==="edit"){ openEditor(+v); return; }
  if(a==="zoom"){ zoomAct(v); return; }
  if(a==="wk-png"){ exportPng(); return; }
  if(a==="wk-pdf"){ exportPdf(); return; }
  if(a==="mat-open"){ openMat(); return; }
  if(a==="mat-import"){ importMat(); return; }
  if(a==="mat-clear"){ if(confirm("Apagar todas as matrículas importadas neste navegador?")){ state.edits.matriculas = {}; saveEdits(); render(); openMat(); } return; }
  if(a==="close"){ document.getElementById("dlg").close(); return; }
  if(a==="save"){ saveEditor(+v); return; }
  if(a==="restore"){ restoreClass(+v); return; }
  if(a==="role"){
    const n = t.dataset.n;
    if(roleOf(n)===v) state.edits.funcoes[n] = ""; else state.edits.funcoes[n] = v;
    if(!state.edits.funcoes[n] && !(DATA.funcoes||{})[n]) delete state.edits.funcoes[n];
    saveEdits(); render(); return;
  }
  if(a==="export"){ exportEdits(); return; }
  if(a==="import"){ document.getElementById("imp").click(); return; }
  if(a==="reset"){
    if(confirm("Descartar todas as alterações feitas neste navegador (professores, auxiliares e funções)?")){
      state.edits = {turmas:{}, funcoes:{}, pessoas:[], matriculas:{}}; saveEdits(); applyEdits(); render();
    }
    return;
  }
  if(a==="tab"){ state.tab = v; store.set("tab", v); }
  else if(a==="view"){ state.view = v; store.set("view", v); }
  else if(a==="cat"){ state.cats.has(v) ? state.cats.delete(v) : state.cats.add(v); }
  render();
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.act==="person"){ state.person = t.value; render(); }
  if(t.dataset.act==="issueperson"){ state.issuePerson = t.value; render(); }
  if(t.dataset.act==="courts"){
    const n = parseInt(t.value,10);
    if(n>0) state.courts[state.tab] = n; else delete state.courts[state.tab];
    store.set("quadras", state.courts); render();
  }
});

/* ---------- edição de professor/auxiliares ---------- */
function otherClassesOf(c, name){
  if(!name) return [];
  return DATA.classes.filter(o => o.parent!==c.parent && people(o).some(p => p.n===name) &&
    o.slots.some(a => c.slots.some(b => a.d===b.d && overlap(a,b))));
}
function nameSelect(id, sel, allowEmpty){
  return `<select id="${id}">${allowEmpty ? '<option value="">— sem auxiliar —</option>' : ""}${staffNames().map(n =>
    `<option value="${esc(n)}"${n===sel?" selected":""}>${roleOf(n) ? ROLES[roleOf(n)].icon+" " : ""}${esc(n)}</option>`).join("")}<option value="__new__">+ Nova pessoa…</option></select>`;
}
function scopeVals(o, d){
  const e = effEntry(o);
  return d && e.dias[d] ? {prof:e.dias[d].prof, aux:e.dias[d].aux, q:e.dias[d].q || e.q} : {prof:e.prof, aux:e.aux, q:e.q};
}
function openEditor(id, scope){
  const pid = id % 1000, o = ORIG.find(x => x.id===pid), dlg = document.getElementById("dlg");
  if(scope===undefined) scope = id >= 1000 ? DAYS[Math.floor(id/1000)-1] : "";

function commitEntry(o, entry){
  const b = BASE[o.id], baseDias = (DATA.dias||{})[ckey(o)] || {};
  const same = entry.prof===b.prof && entry.aux.join("|")===b.aux.join("|") && entry.q===b.q &&
               JSON.stringify(entry.dias)===JSON.stringify(baseDias);
  if(same) delete state.edits.turmas[ckey(o)]; else state.edits.turmas[ckey(o)] = entry;
  saveEdits(); applyEdits(); document.getElementById("dlg").close(); render();
}
function saveEditor(id){
  const {o, scope} = editorClass(), [p,a1,a2] = editorValues();
  const aux = [a1,a2].filter(Boolean), q = +document.getElementById("ed-q").value || 1;
  const entry = effEntry(o);
  if(scope) entry.dias[scope] = {prof:p, aux, q};
  else { entry.prof = p; entry.aux = aux; entry.q = q; }
  for(const d of Object.keys(entry.dias)){
    const x = entry.dias[d];
    if(x.prof===entry.prof && x.aux.join("|")===entry.aux.join("|") && (x.q||entry.q)===entry.q) delete entry.dias[d];
  }
  commitEntry(o, entry);
}
function restoreClass(id){
  const {o, scope} = editorClass();
  if(!scope){ delete state.edits.turmas[ckey(o)]; saveEdits(); applyEdits(); document.getElementById("dlg").close(); render(); return; }
  const entry = effEntry(o); delete entry.dias[scope]; commitEntry(o, entry);
}

/* grade semanal */
function weekLayout(cs){
  const slots = cs.flatMap(c => c.slots.map(s => ({...s, c})));
  const hours = [];
  for(let h=0; h<24; h++) if(slots.some(s => s.s < (h+1)*60 && s.e > h*60)) hours.push(h);
  const off = {}; let y = 10, prev = null; const gaps = [];
  for(const h of hours){
    if(prev!==null && h!==prev+1){ gaps.push(y); y += GAPH; }
    off[h] = y; y += 60*PPM; prev = h;
  }
  const H = y + 10;
  const Y = m => off[Math.floor(m/60)] + (m%60)*PPM;
  const Yend = m => Y(m-1) + PPM;
  const days = DAYS.filter(d => slots.some(s => s.d===d));
  const lanesPer = {}, placed = {};
  for(const d of days){
    const ds = slots.filter(s => s.d===d).sort((a,b) => a.s-b.s || b.e-a.e);
    let cluster = [], end = -1, maxL = 1;
    const flush = () => { cluster.forEach(s => s.n = Math.max(1, ...cluster.map(x => x.lane+1))); maxL = Math.max(maxL, ...cluster.map(s=>s.n), 1); cluster = []; };
    for(const s of ds){
      if(cluster.length && s.s >= end) { flush(); end = -1; }
      const used = cluster.filter(x => x.e > s.s).map(x => x.lane);
      let l = 0; while(used.includes(l)) l++;
      s.lane = l; cluster.push(s); end = Math.max(end, s.e);
    }
    flush(); lanesPer[d] = maxL; placed[d] = ds;
  }
  return {slots, hours, off, gaps, H, Y, Yend, days, lanesPer, placed};
}
function weekView(cs, showUnit, title){
  const L = weekLayout(cs);
  if(!L.slots.length) return "";
  state.lastWeek = {cs, showUnit, title: title || "Semana"};
  const {hours, off, gaps, H, Y, Yend, days, lanesPer, placed} = L;
  const cols = `54px ${days.map(d => `minmax(${Math.max(150, lanesPer[d]*138)}px,${lanesPer[d]}fr)`).join(" ")}`;

  const gut = `<div class="gut" style="height:${H}px">${hours.map(h => `<span style="top:${off[h]}px">${String(h).padStart(2,"0")}:00</span>`).join("")}</div>`;
  const body = days.map(d => `<div class="col" style="height:${H}px">
      ${hours.map(h => `<div class="hl" style="top:${off[h]}px"></div>`).join("")}
      ${gaps.map(g => `<div class="gap" style="top:${g}px;height:${GAPH}px"></div>`).join("")}
      ${placed[d].map(s => {
        const top = Y(s.s), h = Yend(s.e) - top, w = 100/s.n;
        const dim = (showUnit || visible(s.c)) ? "" : " dim";
        const bad = issueClassIds.has(s.c.id) ? " bad" : "";
        const tip = `${s.c.name} (${s.c.cat})\n${hm(s.s)}–${hm(s.e)}\nClique para editar\nProf: ${s.c.prof}${s.c.aux.length ? "\nAux: "+s.c.aux.join(", ") : ""}${bad ? "\n⚠ pessoa em outra turma no mesmo horário" : ""}`;
        return `<div class="blk ${CATS[s.c.cat]||""}${dim}${bad}" data-act="edit" data-v="${s.c.id}" title="${esc(tip)}" style="top:${top}px;height:${h-2}px;left:calc(${s.lane*w}% + 2px);width:calc(${w}% - 4px)">
          <b class="bn">${esc(s.c.name)}</b><span class="t">${showUnit ? esc(s.c.unit)+" · " : ""}${hm(s.s)}–${hm(s.e)}${s.c.q>1 ? " · "+s.c.q+" quadras" : ""}</span>${matPill(s.c)}
          <div class="pp"><span class="pl">Prof</span>${ic(s.c.prof)}${esc(first(s.c.prof))}</div>
          ${s.c.aux.map(n => `<div class="pa"><span class="pl">Aux</span>${ic(n)}${esc(first(n))}</div>`).join("")}</div>`; }).join("")}
    </div>`).join("");
  return `<div id="wkwrap"><div class="bar zbar">
      <div class="seg"><button data-act="zoom" data-v="-" title="Diminuir">−</button><button class="zpct" disabled>100%</button><button data-act="zoom" data-v="+" title="Aumentar">+</button></div>
      <button class="btn" data-act="zoom" data-v="w">↔ Ajustar à largura</button>
      <button class="btn" data-act="zoom" data-v="full">⛶ Tela cheia</button>
      <button class="btn" data-act="wk-png">🖼 Baixar PNG</button>
      <button class="btn" data-act="wk-pdf">📄 Baixar PDF</button>
    </div>
    <div class="wk"><div class="wkgrid" style="grid-template-columns:${cols}">
    <div class="dh" style="border-left:0"></div>${heads}${gut}${body}</div></div>
    <p class="muted small">Faixas listradas = horários sem aula (ocultados). Borda vermelha = alguém dessa turma está em outra turma ao mesmo tempo (veja “Conflitos”).</p></div>`;
}

/* zoom */
function applyZoom(){
  const wrap = document.getElementById("wkwrap"); if(!wrap) return;
  const g = wrap.querySelector(".wkgrid"), box = wrap.querySelector(".wk"), bar = wrap.querySelector(".zbar");
  g.style.zoom = 1; g.style.width = "max-content";
  const nw = g.offsetWidth, nh = g.offsetHeight;
  const availW = box.clientWidth - 2;
  const full = document.fullscreenElement === wrap;
  if(state.fit){
    let z = availW / nw;
    if(state.fit==="all" && full) z = Math.min(z, (wrap.clientHeight - bar.offsetHeight - 40) / nh);
    state.zoom = Math.max(0.2, Math.min(z, 2));
  }
  const z = state.zoom;
  g.style.zoom = z;
  g.style.width = Math.max(availW / z, nw) + "px";
  wrap.querySelector(".zpct").textContent = Math.round(z*100) + "%";
}
function zoomAct(v){
  if(v==="+" || v==="-"){ state.fit = null; state.zoom = Math.max(0.2, Math.min(2, +(state.zoom + (v==="+" ? 0.1 : -0.1)).toFixed(2))); }
  else if(v==="w"){ state.fit = "w"; }
  else if(v==="full"){
    const wrap = document.getElementById("wkwrap");
    if(document.fullscreenElement){ document.exitFullscreen(); return; }
    state.fit = "all";
    if(wrap.requestFullscreen) wrap.requestFullscreen().catch(() => { state.fit = "w"; applyZoom(); });
  }
  applyZoom();
}
document.addEventListener("fullscreenchange", () => { if(!document.fullscreenElement && state.fit==="all") state.fit = "w"; applyZoom(); });
window.addEventListener("resize", () => { if(state.fit) applyZoom(); });

/* exportar como imagem / PDF */
const CAT_HEX = {Kids:"#d98a00", Teens:"#0f9d8a", Adulto:"#3b6fd4", Competitivo:"#8a4fd0", Korpus:"#d6336c"};
const mixWhite = (hex, a) => { const n = parseInt(hex.slice(1),16); return `rgb(${[n>>16, (n>>8)&255, n&255].map(c => Math.round(255 - (255-c)*a)).join(",")})`; };
function drawWeekCanvas(){
  const {cs, showUnit, title} = state.lastWeek, L = weekLayout(cs), S = 2;
  const FONT = "system-ui,-apple-system,'Segoe UI',Roboto,'Noto Color Emoji',sans-serif";
  const GW = 64, HDR = 38, TOP = 70, FOOT = 40, dw = {};
  let W = GW; L.days.forEach(d => { dw[d] = Math.max(210, L.lanesPer[d]*170); W += dw[d]; });
  const Ht = TOP + HDR + L.H + FOOT, gy = TOP + HDR;
  const cv = document.createElement("canvas"); cv.width = W*S; cv.height = Ht*S;
  const x = cv.getContext("2d"); x.scale(S,S);
  const rr = (px,py,w,h,r) => { x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); };
  const wrapTxt = (t, maxW) => { const out = []; let line = ""; for(const w of t.split(" ")){ const tr = line ? line+" "+w : w; if(x.measureText(tr).width > maxW && line){ out.push(line); line = w; } else line = tr; } out.push(line); return out; };
  x.fillStyle = "#fff"; x.fillRect(0,0,W,Ht);
  x.textBaseline = "alphabetic";
  x.fillStyle = "#1b2330"; x.font = `800 26px ${FONT}`; x.fillText(title, 16, 40);
  x.fillStyle = "#5d6878"; x.font = `500 13px ${FONT}`; x.fillText("Planner de Treinos · gerado em "+new Date().toLocaleDateString("pt-BR"), 16, 60);
  let lx = W - 16; x.font = `600 13px ${FONT}`;
  for(const k of Object.keys(CAT_HEX).reverse()){
    lx -= x.measureText(k).width; x.fillStyle = "#1b2330"; x.fillText(k, lx, 40);
    lx -= 18; x.fillStyle = CAT_HEX[k]; rr(lx, 29, 12, 12, 3); x.fill(); lx -= 22;
  }
  x.fillStyle = "#eef0f4"; x.fillRect(0, TOP, W, HDR); x.fillRect(0, gy, GW, L.H);
  x.strokeStyle = "#dde1e8"; x.lineWidth = 1;
  let cx = GW; const colX = {};
  for(const d of L.days){
    colX[d] = cx; x.fillStyle = "#1b2330"; x.font = `700 16px ${FONT}`; x.textAlign = "center";
    x.fillText(DAY_LONG[d], cx + dw[d]/2, TOP + 25); x.textAlign = "left";
    x.beginPath(); x.moveTo(cx+.5, TOP); x.lineTo(cx+.5, gy+L.H); x.stroke(); cx += dw[d];
  }
  for(const g of L.gaps){ x.fillStyle = "#e9ecf2"; x.fillRect(GW, gy+g, W-GW, GAPH); }
  x.font = `500 12px ${FONT}`; x.fillStyle = "#5d6878"; x.textAlign = "right";
  for(const h of L.hours){ const yy = gy + L.off[h]; x.fillText(String(h).padStart(2,"0")+":00", GW-8, yy+4);
    x.beginPath(); x.moveTo(GW, yy+.5); x.lineTo(W, yy+.5); x.stroke(); }
  x.textAlign = "left";
  for(const d of L.days) for(const s of L.placed[d]){
    const c = s.c, hex = CAT_HEX[c.cat] || "#667", bw = dw[d]/s.n - 6, bx = colX[d] + s.lane*(dw[d]/s.n) + 3;
    const by = gy + L.Y(s.s) + 1, bh = L.Yend(s.e) - L.Y(s.s) - 2;
    const dim = !showUnit && !visible(c);
    x.save(); x.globalAlpha = dim ? 0.2 : 1;
    rr(bx, by, bw, bh, 7); x.fillStyle = mixWhite(hex, 0.17); x.fill();
    x.save(); rr(bx, by, bw, bh, 7); x.clip();
    x.fillStyle = hex; x.fillRect(bx, by, 4, bh);
    const tx = bx + 11, mw = bw - 16; let ty = by + 16;
    x.fillStyle = "#1b2330"; x.font = `700 13px ${FONT}`;
    for(const ln of wrapTxt(c.name, mw).slice(0,2)){ x.fillText(ln, tx, ty); ty += 14; }
    x.font = `500 12px ${FONT}`; x.fillStyle = "#5d6878";
    x.fillText((showUnit ? c.unit+" · " : "")+hm(s.s)+"–"+hm(s.e)+(c.q>1 ? " · "+c.q+" quadras" : ""), tx, ty); ty += 15;
    const m = matOf(c);
    if(m){ x.font = `700 12px ${FONT}`; x.fillStyle = matLevel(m)==="full" ? "#c62828" : matLevel(m)==="near" ? "#a15c00" : "#1b2330"; x.fillText(`👥 ${m.qtd}/${m.limite}`, tx, ty); ty += 15; }
    const person = (n, size, lab) => { x.font = `700 9px ${FONT}`; x.fillStyle = "#5d6878"; x.fillText(lab, tx, ty);
      const lw = x.measureText(lab).width + 5; x.font = `800 ${size}px ${FONT}`; x.fillStyle = "#1b2330";
      x.fillText((roleOf(n) ? ROLES[roleOf(n)].icon+" " : "")+first(n), tx+lw, ty); ty += size+3; };
    ty += 3; person(c.prof, 16, "PROF"); c.aux.forEach(n => person(n, 15, "AUX"));
    x.restore();
    if(issueClassIds.has(c.id)){ rr(bx+1, by+1, bw-2, bh-2, 7); x.strokeStyle = "#c62828"; x.lineWidth = 2; x.stroke(); x.strokeStyle = "#dde1e8"; x.lineWidth = 1; }
    x.restore();
  }
  x.fillStyle = "#5d6878"; x.font = `500 12px ${FONT}`;
  x.fillText("🎓 professor formado · 🌱 estagiário · 👥 alunos/limite da turma · borda vermelha = pessoa em duas turmas ao mesmo tempo", 16, Ht - 16);
  return cv;
}
const slug = s => normTxt(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function download(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportPng(){
  const cv = drawWeekCanvas();
  cv.toBlob(b => download(b, slug(state.lastWeek.title)+".png"), "image/png");
}
function exportPdf(){
  const cv = drawWeekCanvas();
  const bin = atob(cv.toDataURL("image/jpeg", 0.93).split(",")[1]), jpg = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) jpg[i] = bin.charCodeAt(i);
  const pw = cv.width >= cv.height ? 842 : 595, ph = Math.round(pw * cv.height / cv.width);
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = b => { const u = typeof b==="string" ? enc.encode(b) : b; parts.push(u); len += u.length; };
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n${body}\nendobj\n`); };
  push("%PDF-1.4\n");
  obj(1, "<</Type/Catalog/Pages 2 0 R>>");
  obj(2, "<</Type/Pages/Kids[3 0 R]/Count 1>>");
  obj(3, `<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`);
  offs[4] = len;
  push(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${cv.width}/Height ${cv.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`);
  push(jpg); push("\nendstream\nendobj\n");
  const content = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  obj(5, `<</Length ${content.length}>>\nstream\n${content}\nendstream`);
  const xref = len; let xr = "xref\n0 6\n0000000000 65535 f \n";
  for(let i=1;i<=5;i++) xr += String(offs[i]).padStart(10,"0") + " 00000 n \n";
  push(xr + `trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`);
  download(new Blob(parts, {type:"application/pdf"}), slug(state.lastWeek.title)+".pdf");
}

/* tabela de turmas */
function classTable(cs, showUnit){
  const order = Object.keys(CATS);
  const rows = [...cs].sort((a,b) => order.indexOf(a.cat)-order.indexOf(b.cat) || a.slots[0].s - b.slots[0].s);
  return `<div class="tw"><table><thead><tr>${showUnit?"<th>Unidade</th>":""}<th>Turma</th><th>Categoria</th><th>Dias e horário</th><th>Professor responsável</th><th>Auxiliares</th><th>Alunos</th><th>Quadras</th><th></th></tr></thead><tbody>
    ${rows.map(c => `<tr>${showUnit?`<td>${esc(c.unit)}</td>`:""}<td><b>${esc(c.name)}</b></td>
      <td><span class="tag ${CATS[c.cat]||""}">${esc(c.cat)}</span></td><td>${esc(fmtSlots(c))}</td>
      <td class="who">${ic(c.prof)}${esc(c.prof)}</td><td class="who">${c.aux.length ? c.aux.map(n => ic(n)+esc(n)).join("<br>") : '<span class="muted">—</span>'}</td>
      <td>${matCell(c)}</td><td>${c.q||1}</td>
      <td><button class="edbtn" data-act="edit" data-v="${c.id}">✏️ Editar</button></td></tr>`).join("")}
  </tbody></table></div>`;
}

/* equipe */
function peopleView(cs, showUnit){
  const map = new Map();
  for(const c of cs) for(const p of people(c)){
    const e = map.get(p.n) || {n:p.n, items:new Map(), units:new Set()};
    const it = e.items.get(c.id) || {c, roles:new Set()}; it.roles.add(p.r); e.items.set(c.id, it);
    e.units.add(c.unit); map.set(p.n, e);
  }
  const list = [...map.values()].sort((a,b) => a.n.localeCompare(b.n,"pt"));
  return `<div class="grid3">${list.map(e => {
    const items = [...e.items.values()].sort((a,b) => a.c.unit.localeCompare(b.c.unit) || a.c.slots[0].s - b.c.slots[0].s);
    const mins = items.reduce((t,i) => t + i.c.slots.reduce((x,s) => x + s.e - s.s, 0), 0);
    const np = items.filter(i => i.roles.has("Prof")).length, na = items.length - np;
    return `<div class="card pcard"><h3>${ic(e.n)}${esc(e.n)}</h3>
      <div class="rolebtns">${Object.entries(ROLES).map(([k,r]) => `<button class="chip" data-act="role" data-n="${esc(e.n)}" data-v="${k}" aria-pressed="${roleOf(e.n)===k}">${r.icon} ${r.label}</button>`).join("")}</div>
      <div class="muted small">${np} como responsável · ${na} como auxiliar · ${(mins/60).toFixed(1).replace(".",",")} h/semana${e.units.size>1 ? " · "+[...e.units].map(esc).join(", ") : ""}</div>
      <ul>${items.map(i => `<li><b>${esc(i.c.name)}</b>${[...i.roles].map(r => `<span class="role ${r==="Prof"?"p":""}">${r==="Prof"?"Resp.":"Aux."}</span>`).join("")}<br>
        <span class="muted">${showUnit ? esc(i.c.unit)+" · " : ""}${esc(fmtSlots(i.c))}</span></li>`).join("")}</ul></div>`;
  }).join("")}</div>`;
}

/* quadras */
function courtsView(u, cs){
  const n = state.courts[u];
  const slots = cs.flatMap(c => c.slots.map(s => ({...s, c})));
  let peakAll = 0;
  const days = DAYS.filter(d => slots.some(s => s.d===d)).map(d => {
    const ds = slots.filter(s => s.d===d);
    const pts = [...new Set(ds.flatMap(s => [s.s, s.e]))].sort((a,b) => a-b);
    const segs = [];
    for(let i=0;i<pts.length-1;i++){
      const act = ds.filter(s => s.s <= pts[i] && s.e >= pts[i+1]);
      if(!act.length) continue;
      const last = segs[segs.length-1], key = act.map(a=>a.c.id).sort().join();
      if(last && last.e===pts[i] && last.key===key) last.e = pts[i+1];
      else segs.push({s:pts[i], e:pts[i+1], act, key});
      segs[segs.length-1].use = segs[segs.length-1].act.reduce((x,a) => x + (a.c.q||1), 0);
    }
    const peak = Math.max(...segs.map(s => s.use));
    peakAll = Math.max(peakAll, peak);
    return {d, segs, peak};
  });
  const note = n
    ? (peakAll > n ? `<div class="note bad">Com ${n} quadra(s), há horários que precisam de mais quadras do que existem (pico: ${peakAll}). Use o ✏️ de cada turma para ajustar quantas quadras ela usa.</div>`
                   : `<div class="note ok">${n} quadra(s) comportam o pico de ${peakAll} quadra(s) em uso ao mesmo tempo. Cada turma usa 1 quadra, a menos que você altere no ✏️ da turma.</div>`)
    : `<div class="note info">Informe a <b>quantidade de quadras</b> de ${esc(u)} no campo acima para ver onde falta espaço. Pico atual: <b>${peakAll}</b> quadra(s) em uso ao mesmo tempo.</div>`;
  return note + `<div class="card"><div class="seglist">${days.map(({d,segs,peak}) =>
    `<div><b>${DAY_LONG[d]}</b><div class="muted small">pico ${peak} quadra(s)</div></div>
     <div>${segs.map(sg => {
       const over = n && sg.use > n;
       return `<div class="iss" style="border-top:0;padding:3px 0"><span class="muted">${hm(sg.s)}–${hm(sg.e)}</span> &nbsp;${
         Array.from({length:sg.use}, (_,i) => `<span class="sq${n && i>=n?" over":""}"></span>`).join("")}
         <span class="small${over?' bold-bad':''}"> ${sg.use} quadra(s): ${sg.act.map(a => esc(a.c.name)+(a.c.q>1 ? " ("+a.c.q+"q)" : "")).join(", ")}</span></div>`; }).join("")}</div>`).join("")}
  </div></div>`;
}

function rolesSummary(){
  const names = staffNames();
  const groups = {prof:[], est:[], "":[]};
  names.forEach(n => groups[roleOf(n)].push(n));
  const li = l => l.length ? l.map(n => esc(n)).join(", ") : "—";
  return `<div class="card" style="margin-bottom:12px"><div><b>🎓 Professores formados (${groups.prof.length}):</b> <span class="muted">${li(groups.prof)}</span></div>
    <div style="margin-top:4px"><b>🌱 Estagiários (${groups.est.length}):</b> <span class="muted">${li(groups.est)}</span></div>
    ${groups[""].length ? `<div class="note info" style="margin:8px 0 0">Função ainda não definida para <b>${groups[""].length}</b> pessoa(s): ${li(groups[""])}. Marque nos cartões abaixo.</div>` : ""}</div>`;
}

/* ---------- visão geral ---------- */
function overviewView(){
  const cards = DATA.units.map(u => {
    const cs = classesOf(u);
    const staff = new Set(cs.flatMap(c => people(c).map(p => p.n)));
    const cats = Object.keys(CATS).map(k => [k, uniq(cs).filter(c => c.cat===k).length]).filter(x => x[1]);
    const n = state.courts[u];
    return `<div class="card"><h3>${esc(u)}</h3>
      <div>${uniq(cs).length} turmas · ${staff.size} pessoas na equipe</div>
      <div style="margin:6px 0">${cats.map(([k,v]) => `<span class="tag ${CATS[k]}">${k} ${v}</span>`).join(" ")}</div>
      <div class="muted small">Quadras: ${n ? n : "<b>a informar</b>"}</div>
      ${(() => { const ms = uniq(cs).map(matOf).filter(Boolean); if(!ms.length) return ""; const q = ms.reduce((a,m)=>a+m.qtd,0), l = ms.reduce((a,m)=>a+m.limite,0);
        return `<div class="small" style="margin-top:4px">👥 ${q} alunos de ${l} vagas <span class="muted">(${ms.length} de ${uniq(cs).length} turmas)</span></div>`; })()}
      <p><button class="chip" data-act="tab" data-v="${esc(u)}">Abrir planner →</button></p></div>`; }).join("");
  const nIss = CLUSTERS.length;
  return `<div class="grid3" style="margin-bottom:16px">${cards}</div>
    ${nIss ? `<div class="note bad"><b>${CLUSTERS.length}</b> horários em que uma pessoa está em duas ou mais turmas ao mesmo tempo. <a href="#" data-act="tab" data-v="conflitos">Ver conflitos</a></div>` : ""}
    <h2 style="font-size:17px">Todas as turmas</h2>${classTable(DATA.classes, true)}
    <h2 style="font-size:17px;margin-top:20px">Equipe (todas as unidades)</h2>${rolesSummary()}${peopleView(DATA.classes, true)}
    <div class="card" style="margin-top:20px"><h3>Alterações</h3>
      <p class="muted small">Professores, auxiliares e funções editados ficam salvos <b>neste navegador</b>. Para guardar ou levar para outro aparelho, baixe o arquivo e carregue-o depois; para valer para todos, envie o arquivo <code>ajustes.json</code> ao repositório.</p>
      <div class="dlgact"><button class="btn" data-act="mat-open">📋 Colar matrículas</button><button class="btn" data-act="export">Baixar alterações</button><button class="btn" data-act="import">Carregar alterações</button><button class="btn" data-act="reset">Descartar alterações</button></div></div>`;
}

/* ---------- conflitos ---------- */
function issuesView(){
  const who = state.issuePerson || "Glauber Grangeiro de Lima";
  const names = [...new Set(CLUSTERS.map(e => e.n))];
  const allNames = [...new Set(DATA.classes.flatMap(c => people(c).map(p => p.n)))].sort((a,b)=>a.localeCompare(b,"pt"));
  const fmt = it => `<li><b>${esc(it.c.name)}</b> <span class="muted">${esc(it.c.unit)} · ${hm(it.s)}–${hm(it.e)} · ${it.r==="Prof"?"responsável":"auxiliar"}</span></li>`;
  const groupBy = {};
  CLUSTERS.forEach(e => (groupBy[e.n] = groupBy[e.n] || []).push(e));
  const dupHtml = Object.entries(groupBy).sort((a,b) => b[1].length-a[1].length).map(([n, list]) =>
    `<details open><summary>${esc(n)} · ${list.length} horário(s) duplicado(s)</summary>${
      list.map(e => `<div class="iss"><b>${[...new Set(e.days)].map(d => DAY_LONG[d]).join(" / ")}</b>
        <span class="tag bad">${e.items.length} turmas ao mesmo tempo</span><ul style="margin:6px 0 0;padding-left:18px">${e.items.map(fmt).join("")}</ul></div>`).join("")}</details>`).join("");
  const sec = (title, list, mk, open) => `<details${open?" open":""}><summary>${title} (${list.length})</summary>${
    list.length ? list.map(mk).join("") : '<div class="muted">Nada encontrado.</div>'}</details>`;
  const line = e => {
    const f = s => `<b>${esc(s.c.name)}</b> <span class="muted">(${esc(s.c.unit)}, ${hm(s.s)}–${hm(s.e)})</span>`;
    return `<div class="iss"><b>${esc(first(e.n))}</b>: ${f(e.x)} → ${f(e.y)} · ${[...new Set(e.days)].join("/")} · intervalo ${e.gap} min</div>`;
  };
  const personClasses = DATA.classes.filter(c => people(c).some(p => p.n===who));
  return `<p class="muted">Cada pessoa só pode estar em uma turma por vez. Abaixo, tudo que a planilha coloca em duas ou mais turmas no mesmo horário.</p>
  <div class="card">${dupHtml || '<div class="note ok">Nenhuma sobreposição.</div>'}</div>
  <h2 style="font-size:17px;margin-top:20px">Agenda da pessoa (todas as unidades)</h2>
  <div class="bar"><label class="f">Pessoa <select data-act="issueperson">${allNames.map(n =>
    `<option value="${esc(n)}"${n===who?" selected":""}>${esc(n)}</option>`).join("")}</select></label></div>
  ${weekView(personClasses, true, "Agenda de "+who)}
  <h2 style="font-size:17px;margin-top:20px">Outros avisos</h2>
  <div class="card">
  ${sec("Troca de unidade sem intervalo (menos de 30 min)", ISSUES.desl, line, false)}
  ${sec("Estagiário como responsável pela turma", ISSUES.estResp, c => `<div class="iss"><b>${esc(c.name)}</b> (${esc(c.unit)}): 🌱 ${esc(c.prof)}</div>`, true)}
  ${sec("Professor também listado como auxiliar na mesma turma", ISSUES.mesma, c => `<div class="iss"><b>${esc(c.name)}</b> (${esc(c.unit)}): ${esc(c.prof)}</div>`, true)}
  ${sec("Turmas sem auxiliar", ISSUES.semAux, c => `<div class="iss"><b>${esc(c.name)}</b> (${esc(c.unit)}) · ${esc(fmtSlots(c))} · prof. ${esc(first(c.prof))}</div>`, false)}
  </div>`;
}

render();
